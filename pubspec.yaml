name: study_rail
description: Professional exam preparation app for Indian Railway employees

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  get: ^4.6.6
  cached_network_image: ^3.3.1
  flutter_staggered_animations: ^1.1.1
  shared_preferences: ^2.2.3
  percent_indicator: ^4.2.3
  shimmer: ^3.0.0
  flutter_spinkit: ^5.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true